<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="408" viewBox="0 0 1200 408" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="title desc">
  <title id="title">EMBER ground station</title>
  <desc id="desc">One LibreSDR receives UHF or serves the LTE-M cell. Both radio feeds enter the ember Yamcs instance. A direct IHU USB console feeds ember-bench. Both instances are accessible from an operator laptop.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#536578"/>
    </marker>
  </defs>
  <rect width="1200" height="408" fill="#FFFFFF"/>
  <rect x="309" y="18" width="686" height="372" rx="16" fill="#F5F8FB" stroke="#BFCBD6" stroke-width="2"/>
  <g font-size="15" font-weight="bold" fill="#536578" letter-spacing="1">
    <text x="24" y="43">EMBER</text>
    <text x="333" y="43">GROUND PI</text>
    <text x="1030" y="43">OPERATOR</text>
  </g>
  <g fill="none" stroke="#536578" stroke-width="2" marker-end="url(#arrow)">
    <path d="M200 120H333"/>
    <path d="M200 215H333"/>
    <path d="M200 327H333"/>
    <path d="M563 120H708V144H758"/>
    <path d="M563 215H708V174H758"/>
    <path d="M563 327H758"/>
    <path d="M973 159H1007V225H1030"/>
    <path d="M973 327H1007V252H1030"/>
  </g>
  <g font-size="15" fill="#536578" text-anchor="middle">
    <text x="266" y="108">UHF</text>
    <text x="266" y="203">LTE-M</text>
    <text x="266" y="315">Direct USB</text>
    <text x="631" y="108">uhf-tm-in</text>
    <text x="631" y="203">lte-tm-in</text>
    <text x="647" y="315">ihu-serial-in</text>
  </g>
  <g stroke-width="2">
    <g fill="#E6F3F7" stroke="#12647D">
      <rect x="24" y="88" width="176" height="64" rx="12"/>
      <rect x="24" y="183" width="176" height="64" rx="12"/>
      <rect x="24" y="295" width="176" height="64" rx="12"/>
    </g>
    <g fill="#F1F3E6" stroke="#536B30">
      <rect x="333" y="88" width="230" height="64" rx="12"/>
      <rect x="333" y="183" width="230" height="64" rx="12"/>
      <rect x="333" y="295" width="230" height="64" rx="12"/>
    </g>
    <g fill="#F0EDF7" stroke="#624985">
      <rect x="758" y="127" width="215" height="64" rx="12"/>
      <rect x="758" y="295" width="215" height="64" rx="12"/>
      <rect x="1030" y="207" width="146" height="64" rx="12"/>
    </g>
  </g>
  <g text-anchor="middle" font-size="16">
    <g fill="#12647D">
      <text x="112" y="115" font-size="19" font-weight="bold">Transceiver</text>
      <text x="112" y="139">DBPSK radio</text>
      <text x="112" y="210" font-size="19" font-weight="bold">Walter</text>
      <text x="112" y="234">LTE-M modem</text>
      <text x="112" y="322" font-size="19" font-weight="bold">IHU</text>
      <text x="112" y="346">Wired bench console</text>
    </g>
    <g fill="#536B30">
      <text x="448" y="115" font-size="19" font-weight="bold">UHF gateway</text>
      <text x="448" y="139">LibreSDR · DBPSK decoder</text>
      <text x="448" y="210" font-size="19" font-weight="bold">LTE-M cell</text>
      <text x="448" y="234">LibreSDR · EPC · UDP listener</text>
      <text x="448" y="322" font-size="19" font-weight="bold">Serial bridge</text>
      <text x="448" y="346">Starts on IHU connection</text>
    </g>
    <g fill="#624985">
      <text x="865.5" y="154" font-size="19" font-weight="bold">Yamcs · ember</text>
      <text x="865.5" y="178">Radio telemetry</text>
      <text x="865.5" y="322" font-size="19" font-weight="bold">Yamcs · ember-bench</text>
      <text x="865.5" y="346">Wired telemetry</text>
      <text x="1103" y="234" font-size="19" font-weight="bold">Browser</text>
      <text x="1103" y="258" font-size="14">Ethernet or hotspot</text>
    </g>
  </g>
  <text x="333" y="274" font-size="14" fill="#536578">One shared LibreSDR · one radio session at a time</text>
</svg>
