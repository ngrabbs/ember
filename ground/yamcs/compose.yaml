name: ember-ground-starter
services:
  yamcs:
    image: maven:3.9.9-eclipse-temurin-17
    working_dir: /yamcs
    command: ["mvn", "-B", "compile", "yamcs:run"]
    volumes:
      - ./.runtime/quickstart:/yamcs
      - maven-cache:/root/.m2
      - yamcs-data:/yamcs-data
    ports:
      - "${EMBER_HTTP_BIND:-127.0.0.1}:${EMBER_HTTP_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/api/instances/myproject"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  simulator:
    image: python:3.12-slim
    working_dir: /simulator
    command: ["python", "-u", "simulator.py", "--tm_host", "yamcs", "--tc_host", "0.0.0.0"]
    volumes:
      - ./.runtime/quickstart:/simulator:ro
    depends_on:
      yamcs:
        condition: service_healthy
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  maven-cache:
  yamcs-data:
