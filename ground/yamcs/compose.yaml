name: ember-ground-starter
services:
  yamcs:
    image: maven:3.9.9-eclipse-temurin-17
    restart: unless-stopped
    working_dir: /yamcs
    command: ["mvn", "-B", "compile", "yamcs:run"]
    depends_on:
      simulator:
        condition: service_started
      ember-simulator:
        condition: service_started
    volumes:
      - ./.runtime/quickstart:/yamcs
      - maven-cache:/root/.m2
      - yamcs-data:/yamcs-data
    ports:
      - "${EMBER_HTTP_BIND:-127.0.0.1}:${EMBER_HTTP_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/api/instances/ember"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  simulator:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /simulator
    command: ["python", "-u", "/wait-and-simulate.py"]
    volumes:
      - ./.runtime/quickstart:/simulator:ro
      - ./wait-and-simulate.py:/wait-and-simulate.py:ro
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  ember-simulator:
    image: python:3.12-slim
    restart: unless-stopped
    working_dir: /ember
    command: ["python", "-u", "simulator.py"]
    volumes:
      - ../ember:/ember:ro
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  maven-cache:
  yamcs-data:
