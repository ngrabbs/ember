[Unit]
# Local bench operation must not wait for an Internet-connected network.
Wants=
After=
After=docker.service tailscaled.service

[Service]
# HTTP must be available on the Ethernet and hotspot interfaces.
Environment=EMBER_HTTP_BIND=0.0.0.0
ExecStartPre=/usr/bin/python3 /opt/ember-ground/check_http_port.py
Restart=on-failure
RestartSec=10
